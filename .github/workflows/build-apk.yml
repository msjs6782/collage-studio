# Builds the APK on every push and publishes it on the repository's Releases page,
# so it can be downloaded straight to a phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CollageStudio-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CollageStudio-apk
          path: CollageStudio-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: استوديو الكولاج - نسخة ${{ github.run_number }}
          body: حمّل ملف الـ APK من الأسفل وثبّته على جوالك.
          files: CollageStudio-${{ github.run_number }}.apk
